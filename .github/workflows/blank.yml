name: Daily Keep-Alive Ping

on:
  schedule:
    - cron: '0 3 * * *'   # كل يوم الساعة 3 صباحًا UTC
  workflow_dispatch:        # يسمحلك تشغّله يدويًا من تبويب Actions للتجربة

permissions:
  contents: write   # لازم عشان الخطوة الأخيرة تقدر تعمل commit للريبو

jobs:
  ping-supabase-projects:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ping Project 1 - fetch branches
        run: |
          STATUS=$(curl -s -o /tmp/response1.json -w "%{http_code}" \
            "${{ secrets.PROJECT1_URL }}/rest/v1/branches?select=*" \
            -H "apikey: ${{ secrets.PROJECT1_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.PROJECT1_KEY }}")
          echo "Project 1 response code: $STATUS"
          cat /tmp/response1.json
          if [ "$STATUS" -ne 200 ]; then
            echo "::error::Project 1 request failed with status $STATUS"
            exit 1
          fi

      - name: Ping Project 2 - fetch branches
        run: |
          STATUS=$(curl -s -o /tmp/response2.json -w "%{http_code}" \
            "${{ secrets.PROJECT2_URL }}/rest/v1/branches?select=*" \
            -H "apikey: ${{ secrets.PROJECT2_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.PROJECT2_KEY }}")
          echo "Project 2 response code: $STATUS"
          cat /tmp/response2.json
          if [ "$STATUS" -ne 200 ]; then
            echo "::error::Project 2 request failed with status $STATUS"
            exit 1
          fi

      - name: Keep repo active (prevent GitHub's 60-day auto-disable)
        run: |
          LAST_COMMIT_EPOCH=$(git log -1 --format=%ct)
          NOW_EPOCH=$(date +%s)
          DAYS_SINCE=$(( (NOW_EPOCH - LAST_COMMIT_EPOCH) / 86400 ))
          echo "Days since last commit: $DAYS_SINCE"

          if [ "$DAYS_SINCE" -ge 30 ]; then
            mkdir -p .github
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive-marker.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive-marker.txt
            git commit -m "chore: keepalive marker (prevents workflow auto-disable after 60 days)"
            git push
          else
            echo "Repo has recent activity ($DAYS_SINCE days ago), no commit needed."
          fi
